{% extends 'base.html' %}

{% block pagetitle %}
    Edit Member
{% endblock %}

{% block pagecontent %}

<div class="edit-member-header">
    <div>
        <h1>Edit Member</h1>
        <p>Update member information</p>
    </div>

    <a href="{% url 'MemberDetails' member.id%}" class="secondary-btn">
        Cancel
    </a>
</div>


<form 
    method="POST"
    class="edit-member-form"
    onsubmit="return confirm('Are you sure you want to save these changes?');">
    {% csrf_token %}

    <div class="edit-form-grid">

        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input
                type="text"
                id="full_name"
                name="full_name"
                value="{{ member.full_name }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input
                type="text"
                id="phone"
                name="phone"
                value="{{ member.phone }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ member.email }}"
            >
        </div>

        <div class="form-group">
            <label for="date_of_birth">Date of Birth</label>
            <input
                type="date"
                id="date_of_birth"
                name="date_of_birth"
                value="{{ member.date_of_birth|date:'Y-m-d' }}"
                required
            >
        </div>

        <div class="form-group full-width">
            <label for="address">Address</label>
            <textarea
                id="address"
                name="address"
                rows="4"
                required
            >{{ member.address }}</textarea>
        </div>

        <div class="form-group">
            <label for="joined_date">Joined Date</label>
            <input
                type="date"
                id="joined_date"
                name="joined_date"
                value="{{ member.joined_date|date:'Y-m-d' }}"
                required
            >
        </div>

                
        <div class="form-group">
            <label>Status</label>

            <div class="radio-group">
                <label>
                    <input
                        type="radio"
                        name="status"
                        value=True
                        {% if member.status %}checked{% endif %}
                    >
                    Active
                </label>

                <label>
                    <input
                        type="radio"
                        name="status"
                        value=False
                        {% if not member.status %}checked{% endif %}
                    >
                    Inactive
                </label>
            </div>
        </div>


    </div>

    <div class="form-actions">
        <a href="{% url 'MemberDetails' member.id%}" class="secondary-btn">
            Cancel
        </a>

        <button type="submit" class="primary-btn">
            Save Changes
        </button>
    </div>

</form>

{% endblock %}
